[project]
name = "santas-workshop-mcp"
version = "0.1.0"
description = "An observable Christmas workshop built with FastMCP, OpenTelemetry, and Elastic"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastmcp>=3.4.7,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "elastic-opentelemetry>=1,<2",
  "opentelemetry-instrumentation-httpx>=0.50b0,<1",
  "opentelemetry-instrumentation-asgi>=0.50b0,<1",
  "python-dotenv>=1,<2",
]

[project.scripts]
santa-mcp = "santa_mcp.server:main"
santa-workshop = "santa_mcp.workshop:main"
santa-traffic = "santa_mcp.traffic:main"
santa-setup-elastic = "santa_mcp.setup_elastic:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/santa_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
